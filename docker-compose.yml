services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${RASTA_BIND:-127.0.0.1}:${RASTA_PORT:-8090}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RASTA_DOMAIN: "${RASTA_DOMAIN:?Set RASTA_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks: [web]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      RASTA_AI_URL: http://ai:8012
      RASTA_AI_TOKEN: "${RASTA_AI_TOKEN:?Set RASTA_AI_TOKEN in .env}"
      RASTA_ACCOUNTS_DB: /app/data/accounts/users.sqlite3
      RASTA_DATABASE_URL: "${RASTA_DATABASE_URL:-}"
      RASTA_WORKSPACES: "1"
      RASTA_SECURE_COOKIES: "${RASTA_SECURE_COOKIES:-0}"
      RASTA_ARCHIVE: "${RASTA_ARCHIVE:-1}"
      RASTA_OCR_URL: "${RASTA_OCR_URL:-}"
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - rasta-catalog:/app/data/qdrant
      - rasta-images:/app/data/catalog_images
      - rasta-accounts:/app/data/accounts
      - rasta-archive:/app/data/archive
      - ./models:/app/models:ro
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; raise SystemExit(not json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5))['loaded'])"]
      interval: 15s
      timeout: 7s
      start_period: 30s
      retries: 5
    networks: [web, inference]

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    environment:
      RASTA_AI_TOKEN: "${RASTA_AI_TOKEN:?Set RASTA_AI_TOKEN in .env}"
    volumes:
      - ./models:/app/models:ro
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/ready', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      start_period: 90s
      retries: 5
    networks: [inference]

  # Ixtiyoriy: mahsulot yorlig'idagi yozuvni o'qish (CPU). Yoqish uchun .env ga
  # RASTA_OCR_URL=http://ocr:8013 yoziladi va `docker compose --profile ocr up -d --build`.
  ocr:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: ocr/Dockerfile
    restart: unless-stopped
    environment:
      RASTA_AI_TOKEN: "${RASTA_AI_TOKEN:?Set RASTA_AI_TOKEN in .env}"
      RASTA_OCR_THREADS: "${RASTA_OCR_THREADS:-8}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/ready', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      start_period: 60s
      retries: 5
    networks: [inference]

networks:
  web:
  inference:
    internal: true

volumes:
  rasta-catalog:
  rasta-images:
  rasta-accounts:
  rasta-archive:
  caddy-data:
  caddy-config:
