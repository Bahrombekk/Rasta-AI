<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish · Rasta AI</title>
  <link rel="stylesheet" href="/static/app.css?v=login2">
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/common.js?v=login2" defer></script>
  <script src="/static/login.js?v=login2" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-main">
      <div class="login-brand">
        <a class="logo" href="/"><span class="mark" data-icon="scan"></span><span>Rasta<span class="brand-ai"> AI</span></span></a>
        <button class="iconbtn" type="button" id="theme" aria-label="Rang mavzusini almashtirish"></button>
      </div>
      <div class="login-form" aria-labelledby="login-title">
        <h1 id="login-title">Hisobga kirish</h1>
        <p>Jamoangiz bergan login va parolni kiriting.</p>
        <form id="login-form">
          <div class="login-field">
            <label for="login-name">Login</label>
            <input class="input" id="login-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Loginingiz" required maxlength="64" aria-describedby="error">
          </div>
          <div class="login-field">
            <label for="login-password">Parol</label>
            <div class="password-input">
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Parolingiz" required maxlength="128" aria-describedby="error">
              <button class="iconbtn" id="toggle-password" type="button" aria-label="Parolni ko‘rsatish" aria-pressed="false" data-icon="eye"></button>
            </div>
          </div>
          <div class="login-error" id="error" role="alert" hidden></div>
          <button class="btn primary lg block login-submit" type="submit">
            <span id="submit-text">Kirish</span><span class="submit-icon" data-icon="arrow-right"></span>
          </button>
        </form>
      </div>
    </section>
    <aside class="login-visual" aria-label="Rasta AI haqida">
      <img class="login-photo" src="/static/login-shelf.webp" alt="" fetchpriority="high">
      <div class="login-caption">
        <p class="login-visual-title">Javondagi holatni<br> bir qarashda ko‘ring.</p>
        <p>Mahsulotlar, javondagi ulush va bo‘sh joylar tahlili.</p>
      </div>
    </aside>
  </main>
</body>
</html>
