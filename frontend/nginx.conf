server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    location / { try_files $uri /index.html; expires -1; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /static/ { try_files $uri =404; expires -1; }
    location ~ ^/(api|media)/ {
        resolver 127.0.0.11 valid=15s ipv6=off;
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
